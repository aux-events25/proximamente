<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Nunito,system-ui,sans-serif;color:#2a1d1f;

.caja{position:relative;width:min(92vw,400px);background:#fffaf3;border-radius:26px;padding:30px 22px 22px;text-align:center;overflow:hidden;box-shadow:0 26px 50px -20px rgba(0,0,0,.7)}

h1{margin:14px 0 4px;font-family:"Luckiest Guy",sans-serif;font-weight:400;font-size:34px;color:#c8102e;letter-spacing:.02em}
p{margin:0 0 14px;color:#6e5f61;font-weight:700}
.pasos{text-align:left;background:#f3f8f5;border:2px dashed #2f9e62;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-weight:700;font-size:15px;line-height:1.5}
.pasos b{color:#1f7a4d}
a.boton{display:block;text-decoration:none;border-radius:999px;padding:15px;font:900 18px Nunito,sans-serif;color:#fff;background:#c8102e;box-shadow:0 6px 0 #9a0b22}
a.boton:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
