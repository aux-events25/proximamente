<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Algo se está construyendo…</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
<meta name="apple-mobile-web-app-title" content="Posada">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Posada Navideña · 27 de noviembre">
<meta property="og:title" content="¡Algo se está construyendo!">
<meta property="og:description" content="Posada Navideña · 27 de noviembre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Mountains+of+Christmas:wght@700&family=Saira+Condensed:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#teatro{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 45%,#140a0c 0%,#050304 70%)}

/* Piso del escenario */
#piso{position:absolute;left:0;bottom:0;width:100%;height:var(--ph);z-index:7;display:block}
#caravana{position:absolute;left:0;top:0;width:var(--cv);height:auto;z-index:10;will-change:transform;visibility:hidden}

/* Escenario: dos copias, una en silueta y otra iluminada */
.escenario{position:absolute;left:50%;top:var(--top);width:var(--w);height:var(--h);transform:translateX(-50%)}
.obra{position:absolute;inset:0;width:100%;height:100%;display:block}
.cab{transform-box:fill-box;transform-origin:50% 100%;animation:asiente 2.2s ease-in-out infinite}
.martillo{transform-box:fill-box;transform-origin:10% 95%;animation:martilla .45s ease-in-out infinite alternate}
@keyframes asiente{0%,100%{transform:rotate(0)}40%{transform:rotate(-6deg)}70%{transform:rotate(4deg)}}
@keyframes martilla{from{transform:rotate(-25deg)}to{transform:rotate(12deg)}}

#silueta .obra{filter:brightness(0)}
#silueta{background:radial-gradient(ellipse 60% 55% at 50% 50%,#0f4d32,#0a3324 75%,transparent 100%)}
#luz{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#sombra{position:absolute;inset:0;background:rgba(0,0,0,.62);pointer-events:none}
#haz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}

/* Telón */
.cortina{position:absolute;top:0;height:calc(100% - var(--ph) * .97);z-index:9;overflow:visible}
.cortina.izq{left:-10vw;width:calc(var(--cwI) + 10vw);transform-origin:0 0;animation:viento 6.5s ease-in-out infinite}
.cortina.der{right:-10vw;width:calc(var(--cwD) + 10vw);transform-origin:50% 0;transform:scaleX(-1);animation:vientoDer 7.3s ease-in-out infinite}
@keyframes viento{0%,100%{transform:skewX(0) scaleX(1)}30%{transform:skewX(2.2deg) scaleX(1.04)}60%{transform:skewX(-1.4deg) scaleX(.97)}}
@keyframes vientoDer{0%,100%{transform:scaleX(-1) skewX(0)}35%{transform:scaleX(-1.03) skewX(-2.4deg)}70%{transform:scaleX(-.97) skewX(1.6deg)}}
.pl{animation:ondea 3.4s ease-in-out infinite}
@keyframes ondea{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.orilla{position:absolute;top:0;bottom:calc(var(--ph) * .97);width:calc(var(--cw) * .6);z-index:8;background:linear-gradient(90deg,#3d020c,#6e0718)}
.orilla.izq{left:0}.orilla.der{right:0;transform:scaleX(-1)}
#marquesina{position:absolute;left:50%;top:calc(var(--bh) * .84);width:min(30vw,200px);z-index:11;transform-origin:50% 0;
  transform:translateX(-50%) translateY(-50%);animation:mqMece 6s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
#marquesina svg{display:block;width:100%;height:auto}
@keyframes mqMece{0%,100%{transform:translateX(-50%) translateY(-50%) rotate(-.6deg)}50%{transform:translateX(-50%) translateY(-50%) rotate(.6deg)}}
.foco{fill:#fff3c4;animation:focos 1.2s steps(1) infinite}
.foco.f1{animation-delay:-.4s}.foco.f2{animation-delay:-.8s}
@keyframes focos{0%{fill:#fffbe6;filter:drop-shadow(0 0 4px #ffe08a)}33%{fill:#8a6a20;filter:none}66%{fill:#8a6a20;filter:none}}
#sonido{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);z-index:50;-webkit-appearance:none;appearance:none;border:2px solid #f2c14e;
  background:rgba(42,2,10,.85);color:#fff3c4;font:800 15px Nunito,system-ui,sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 0 18px rgba(242,193,78,.35);animation:llama 1.8s ease-in-out infinite}
#sonido .ico{font-size:18px}
#sonido.activo{left:auto;right:calc(10px + env(safe-area-inset-right));top:calc(var(--bh) + 10px);transform:none;padding:8px 10px;animation:none;opacity:.85}
#sonido.activo .txt{display:none}
#sonido:focus-visible{outline:3px solid #fff3c4;outline-offset:3px}
@keyframes llama{0%,100%{box-shadow:0 0 10px rgba(242,193,78,.25)}50%{box-shadow:0 0 26px rgba(242,193,78,.7)}}
#butacas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:12;pointer-events:none}
#bambalina{position:absolute;left:0;top:0;width:100%;height:var(--bh);z-index:10}



.lampara{position:absolute;z-index:10;width:var(--lw);transform-origin:50% 20%}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ================= APP DE LA POSADA ================= */
#appPosada{position:fixed;inset:0;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;color:#fffaf3;font-family:Nunito,system-ui,sans-serif;
  background:radial-gradient(ellipse 120% 60% at 50% 0%,#1a6b47 0%,#0f4d32 45%,#0c3b29 100%);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#appPosada[hidden]{display:none}
.ap-esferas{display:block;width:100%;height:84px}
.ap-esfera{transform-box:view-box;animation:apColumpio 3.6s ease-in-out infinite}
@keyframes apColumpio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ap-hoja{max-width:460px;margin:-18px auto 0;padding:0 18px}
.ap-tit{position:relative;text-align:center;font-family:"Luckiest Guy",sans-serif;font-weight:400;line-height:.98;font-size:clamp(40px,12vw,58px);margin:4px 0 6px;letter-spacing:.02em}
.ap-tit span{display:block;text-shadow:0 3px 0 #c8102e,0 6px 0 #c8102e,0 9px 0 #9a0b22,0 14px 18px rgba(0,0,0,.35)}
.ap-tit .b{color:#fff}.ap-tit .o{color:#f2c14e}
.ap-tit .b{position:relative;display:inline-block}
.ap-gorro{position:absolute;left:-.3em;top:-.45em;width:.95em;transform:rotate(-18deg);filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.ap-lema{text-align:center;color:#e3f1e8;font-weight:700;font-size:16px;margin:14px 0 18px}
.ap-card{position:relative;background:#fffaf3;color:#2a1d1f;border-radius:24px;padding:28px 20px 20px;overflow:hidden;box-shadow:0 22px 40px -18px rgba(0,0,0,.65)}
.ap-card::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#c8102e 0 12px,#fff 12px 24px)}
.ap-card h2{margin:0 0 6px;font:900 22px Nunito,sans-serif;color:#c8102e}
.ap-card p{margin:0;color:#6e5f61;line-height:1.45}
.ap-campo{display:block;width:100%;margin-top:14px;font:800 22px Nunito,sans-serif;padding:14px 16px;border-radius:14px;border:2px solid #e9dcd2;outline:none;color:#2a1d1f;background:#fff}
.ap-campo:focus{border-color:#1f7a4d}
.ap-ayuda{margin-top:8px !important;font-size:14px}
.ap-ayuda.err{color:#c8102e !important;font-weight:800}
.ap-btn{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:16px;cursor:pointer;font:900 19px Nunito,sans-serif;color:#fff;
  background:#c8102e;box-shadow:0 6px 0 #9a0b22}
.ap-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a0b22}
.ap-btn[disabled]{opacity:.6}
.ap-btn.sec{background:#fff;color:#c8102e;border:2px solid #c8102e;box-shadow:0 4px 0 #e9dcd2}
.ap-btn:focus-visible,.ap-campo:focus-visible,.ap-tile:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
.ap-nota{text-align:center;font-size:14px;color:#6e5f61;margin-top:12px !important}
.ap-cargando{text-align:center;padding:60px 0;font-weight:800;color:#e3f1e8}
/* inicio */
.ap-jugador{display:flex;align-items:center;gap:14px}
.ap-avatar{position:relative;flex:none;width:62px;height:62px;border-radius:50%;background:#1f7a4d;color:#fff;display:grid;place-items:center;font:900 22px Nunito,sans-serif;margin-top:8px}
.ap-avatar svg{position:absolute;top:-20px;left:4px;width:58px;transform:rotate(-12deg)}
.ap-hola{color:#6e5f61;font-weight:700}
.ap-nombre{font:900 24px Nunito,sans-serif;line-height:1.1;word-break:break-word}
.ap-id{font-size:13px;color:#6e5f61;font-weight:700}
.ap-puntos{margin-top:16px;padding-top:14px;border-top:2px dashed #ecdcd3;display:flex;align-items:baseline;justify-content:center;gap:10px}
.ap-puntos b{font-family:"Luckiest Guy",sans-serif;font-weight:400;font-size:62px;line-height:1;color:#c8102e;letter-spacing:.02em}
.ap-puntos span{font:900 18px Nunito,sans-serif;color:#1f7a4d}
.ap-menu{display:grid;gap:14px;margin-top:20px}
.ap-tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:22px;padding:16px 18px;color:#fff;
  box-shadow:0 10px 22px -10px rgba(0,0,0,.6);font-family:Nunito,sans-serif;position:relative;overflow:hidden}
.ap-tile::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-52%);font:900 34px Nunito,sans-serif;opacity:.8}
.ap-tile i{flex:none;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-style:normal;background:rgba(255,255,255,.22)}
.ap-tile b{display:block;font-family:"Luckiest Guy",sans-serif;font-weight:400;font-size:24px;letter-spacing:.02em;line-height:1.05}
.ap-tile small{display:block;font-weight:700;font-size:14px;opacity:.92;margin-top:4px;padding-right:20px}
.ap-tile.rojo{background:linear-gradient(135deg,#e02a45,#9a0b22)}
.ap-tile.verde{background:linear-gradient(135deg,#2f9e62,#145c39)}
.ap-tile.oro{background:linear-gradient(135deg,#f2c14e,#c28a1e);color:#3a2408}
.ap-tile:active{transform:scale(.98)}
.ap-pie{text-align:center;color:#cfe5d8;font-size:14px;margin-top:20px}
.ap-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;max-width:90vw;background:#1f7a4d;color:#fff;
  border:2px solid #f2c14e;border-radius:16px;padding:12px 18px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.4);animation:apEntra .3s ease both}
@keyframes apEntra{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.ap-bono{margin-top:14px;text-align:center;background:#fff3c4;border:2px dashed #f2c14e;border-radius:14px;padding:10px;font-weight:900;color:#9a0b22;animation:apSube .4s ease both}
@keyframes apSube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ap-conf{position:fixed;top:-20px;z-index:310;pointer-events:none;animation:apCae linear forwards}
@keyframes apCae{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#appPosada *{animation:none !important}}

/* ===== Estilos de la pantalla de registro del juego (posadagomez) ===== */
#appPosada{
  --pino:#0c3b29; --pino2:#0f4d32; --hoja:#2f9e62; --hoja2:#1f7a4d;
  --rojo:#c8102e; --rojo2:#9a0b22; --oro:#f2c14e; --nieve:#fffaf3; --tinta:#2a1d1f; --suave:#6e5f61;
}
#appPosada *{box-sizing:border-box}
#appPosada #nieve{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#appPosada .copo{position:absolute;top:-12px;color:#fff;opacity:.85;animation:g_nevar linear infinite}
@keyframes g_nevar{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
#appPosada .esferas{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;position:relative;z-index:2}
#appPosada .esfera{transform-box:view-box;animation:g_columpio 3.6s ease-in-out infinite}
@keyframes g_columpio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
#appPosada .hoja{max-width:440px;margin:0 auto;padding:0 18px;position:relative;z-index:2}
#appPosada .escena{display:block;width:100%;height:auto;margin:-18px 0 0}
#appPosada .arbol{transform-box:view-box;transform-origin:180px 216px;animation:g_crecer 1.1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes g_crecer{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
#appPosada .estrella{transform-box:view-box;transform-origin:180px 46px;
  animation:g_aparece .5s 1s cubic-bezier(.2,1.6,.4,1) both,g_brilla 1.8s 1.5s ease-in-out infinite}
@keyframes g_aparece{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes g_brilla{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px #f2c14e)}50%{transform:scale(1.15);filter:drop-shadow(0 0 10px #ffe08a)}}
#appPosada .luz{animation:g_parpadeo 1.2s ease-in-out infinite}
@keyframes g_parpadeo{0%,100%{opacity:1}50%{opacity:.25}}
#appPosada .santa{animation:g_llega-der .9s .5s cubic-bezier(.2,1.2,.4,1) both}
#appPosada .santa-cuerpo{animation:g_rebote 1.6s 1.4s ease-in-out infinite}
@keyframes g_llega-der{from{transform:translateX(140px);opacity:0}to{transform:none;opacity:1}}
@keyframes g_rebote{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#appPosada .mano{transform-box:view-box;transform-origin:309px 160px;animation:g_saludo .7s 1.4s ease-in-out infinite alternate}
@keyframes g_saludo{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
#appPosada .reno{animation:g_llega-izq .9s .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes g_llega-izq{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}
#appPosada .cabeza{transform-box:view-box;transform-origin:96px 176px;animation:g_asiente 2.4s 1.6s ease-in-out infinite}
@keyframes g_asiente{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}
#appPosada .mono{transform-box:view-box;transform-origin:180px 222px;animation:g_crecer .8s cubic-bezier(.2,1.3,.4,1) both}
#appPosada .mono-cabeza{transform-box:view-box;transform-origin:180px 98px;animation:g_niega .9s .8s ease-in-out infinite}
@keyframes g_niega{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
#appPosada .globo{transform-box:view-box;transform-origin:240px 86px;animation:g_aparece .45s .9s cubic-bezier(.2,1.6,.4,1) both}
#appPosada .mono-regalos{animation:g_llega-izq .8s .3s cubic-bezier(.2,1.2,.4,1) both}
#appPosada .nino-salta{transform-box:fill-box;transform-origin:50% 100%;animation:g_saltar .9s ease-in-out infinite}
@keyframes g_saltar{0%,100%{transform:translateY(0) scaleY(.92)}12%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-36px) scaleY(1.04)}88%{transform:translateY(0) scaleY(1)}}
#appPosada .nino-sombra{transform-box:fill-box;transform-origin:50% 50%;animation:g_sombra .9s ease-in-out infinite}
@keyframes g_sombra{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.5);opacity:.35}}
#appPosada .nino-brazo{transform-box:fill-box;animation:g_agita .45s ease-in-out infinite alternate}
#appPosada .nino-brazo.izq{transform-origin:100% 100%}
#appPosada .nino-brazo.der{transform-origin:0% 100%}
@keyframes g_agita{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
#appPosada .estrella-chica{transform-box:fill-box;transform-origin:50% 50%;animation:g_brilla 1.8s ease-in-out infinite}
#appPosada.blanca .hero h1{color:var(--rojo);text-shadow:0 3px 0 #f2c14e}
#appPosada.blanca .copo{color:#a9c6dc}
#appPosada.blanca .nota{color:var(--suave)}
#appPosada .santa-lee{animation:g_rebote 2s ease-in-out infinite}
#appPosada .carta{transform-box:fill-box;transform-origin:20% 80%;animation:g_lee 2.4s ease-in-out infinite}
@keyframes g_lee{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
#appPosada .escaner{animation:g_escanea 1.3s ease-in-out infinite alternate}
@keyframes g_escanea{from{transform:translateY(0)}to{transform:translateY(32px)}}
#appPosada .duende{animation:g_rebote 1.2s ease-in-out infinite}
#appPosada .duende-cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:g_asiente 2s ease-in-out infinite}
#appPosada .duende-brazo{transform-box:fill-box;transform-origin:0% 10%;animation:g_lee 2s ease-in-out infinite}
#appPosada .revisando{text-align:center;padding:10px 0 30px}
#appPosada .revisando .t{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.35;color:#fff;
  letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#appPosada .revisando .puntitos{display:inline-flex;gap:6px;margin-top:12px}
#appPosada .revisando .puntitos i{width:10px;height:10px;border-radius:50%;background:var(--oro);animation:g_pulso 1s ease-in-out infinite}
#appPosada .revisando .puntitos i:nth-child(2){background:#fff;animation-delay:.15s}
#appPosada .revisando .puntitos i:nth-child(3){background:var(--rojo);animation-delay:.3s}
@keyframes g_pulso{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
#appPosada .hero{text-align:center;margin:0 0 20px}
#appPosada .separador{height:24px}
#appPosada .hero .lugar{font-family:"Mountains of Christmas",cursive;color:var(--oro);font-size:30px;margin:0;line-height:1}
#appPosada .hero h1{font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:clamp(36px,11vw,52px);line-height:1;
  margin:4px 0 0;text-shadow:0 3px 0 var(--rojo2);text-wrap:balance}
#appPosada .tarjeta{position:relative;background:var(--nieve);color:var(--tinta);border-radius:22px;padding:30px 22px 24px;
  overflow:hidden;box-shadow:0 22px 40px -18px rgba(0,0,0,.6)}
#appPosada .tarjeta::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;
  background:repeating-linear-gradient(-45deg,var(--rojo) 0 12px,#fff 12px 24px)}
#appPosada .tarjeta h2{font-family:"Mountains of Christmas",cursive;font-size:34px;line-height:1.05;margin:0 0 8px;color:var(--rojo)}
#appPosada .tarjeta p{margin:0;line-height:1.5;color:var(--suave);font-size:16px}
#appPosada label.campo{display:block;margin-top:20px;font-weight:800;font-size:15px}
#appPosada #n{display:block;width:100%;margin-top:8px;font:600 20px Nunito,sans-serif;padding:14px 16px;border-radius:14px;
  border:2px solid #e9dcd2;background:#fff;color:var(--tinta);outline:none;transition:border-color .15s}
#appPosada #n:focus{border-color:var(--hoja2)}
#appPosada .boton{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:16px 20px;cursor:pointer;
  font:900 19px Nunito,sans-serif;color:#fff;background:var(--rojo);box-shadow:0 6px 0 var(--rojo2);
  transition:transform .08s,box-shadow .08s}
#appPosada .boton:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rojo2)}
#appPosada .boton:focus-visible,#appPosada #n:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
#appPosada .boton[disabled]{opacity:.6}
#appPosada .extra{margin-top:12px !important;font-size:14px !important;text-align:center}
#appPosada .ayuda{margin-top:8px !important;font-size:14px !important}
#appPosada .ayuda.error{color:var(--rojo) !important;font-weight:800}
#appPosada .boton.secundario{background:#fff;color:var(--rojo);border:2px solid var(--rojo);box-shadow:0 4px 0 #e9dcd2}
#appPosada .id-jugador{text-align:center;margin-top:12px !important;font-size:14px !important}
#appPosada .id-jugador b{color:var(--tinta)}
#appPosada .pasos{list-style:none;padding:0;margin:24px 4px 0;counter-reset:p}
#appPosada .pasos li{counter-increment:p;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;line-height:1.45;color:#e3f1e8}

#appPosada .estado .s{color:#e3f1e8;font-size:15px;margin-top:4px;line-height:1.35}

  border-image:repeating-linear-gradient(-45deg,var(--rojo) 0 10px,#fff 10px 20px,var(--hoja2) 20px 30px,#fff 30px 40px) 9;
  box-shadow:0 18px 30px -14px rgba(0,0,0,.6);padding:22px 56px 20px 18px}
#appPosada .estado.ok .t{color:var(--rojo);text-shadow:none}
#appPosada .estado.ok .s{color:var(--hoja2);font-weight:800}
#appPosada .estado.ok .ico{background:#fff3d6;border:2px dashed #e3c98f}
#appPosada .estado.ok .timbre{position:absolute;top:-18px;right:-14px;width:44px;height:52px;background:#fff;transform:rotate(8deg);

  box-shadow:0 3px 6px rgba(0,0,0,.18)}
#appPosada .estado.repetido{background:#f7ecd8;border-color:#e3c98f}

#appPosada .estado.repetido .s{color:var(--rojo2);font-weight:700}
#appPosada .estado.repetido .ico{background:#fff;border:2px solid #f1d9d9}

#appPosada .aviso{display:table;margin:0 auto 14px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:15px;
  background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);color:#fff;animation:g_entra .45s both}

@keyframes g_entra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

#appPosada .puntos{text-align:center;margin-top:22px;padding-top:18px;border-top:2px dashed #ecdcd3}

<script>
// ====== APERTURA DEL TELÓN ======
// Automática: con 31 días o más el telón está casi cerrado y se va abriendo solo cada día hasta el 27 de noviembre.
// Si quieres fijarla a mano, cambia null por un número de 0 (cerrado como ahora) a 100 (abierto del todo).
var APERTURA_MANUAL = null;
var DIAS_TOTALES = 31;
var DIAS=(function(){
  var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Monterrey',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-');
  var q=new URLSearchParams(location.search).get('dias');
  return q!==null?parseInt(q,10):Math.round((Date.UTC(2026,10,27)-Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000);
})();
var raiz=document.documentElement.style, luz=document.getElementById('luz'), sombra=document.getElementById('sombra'), haz=document.getElementById('haz');
var L=[{lamp:document.getElementById('lampIzq'),cono:document.getElementById('cono1'),charco:document.getElementById('charco1'),fx:0.2,vel:0.47,fase:0,vy:0.33},
       {lamp:document.getElementById('lampDer'),cono:document.getElementById('cono2'),charco:document.getElementById('charco2'),fx:0.8,vel:0.39,fase:2.1,vy:0.28}];
function medidas(){
  var W=innerWidth,H=innerHeight,bh=Math.max(70,Math.min(H*0.13,150));
  var ph=Math.max(90,H*0.22), disp=H-bh-ph, w=Math.min(W*(W<700?0.92:0.6), disp*0.86), h=w/0.8;
  raiz.setProperty('--ph',ph+'px');
  raiz.setProperty('--w',w+'px');raiz.setProperty('--h',h+'px');raiz.setProperty('--bh',bh+'px');
  raiz.setProperty('--top',(H-ph-h*0.9)+'px');
  var cw=W<700? W*0.19 : W*0.28;
  // cerrado: el telón izquierdo llega hasta "¡AL / CONS" y el derecho cubre "TÁ / NDO!"
  var izqCerrado=(W-w)/2+0.31*w, derCerrado=(W-w)/2+(1-0.695)*w;
  var ap=APERTURA_MANUAL!==null? APERTURA_MANUAL/100 : Math.max(0,Math.min(1,(DIAS_TOTALES-DIAS)/DIAS_TOTALES));
  var cwI=izqCerrado+(cw-izqCerrado)*ap, cwD=derCerrado+(cw-derCerrado)*ap;
  raiz.setProperty('--cwI',cwI+'px'); raiz.setProperty('--cwD',cwD+'px'); raiz.setProperty('--cw',Math.min(cwI,cwD)+'px');
  var cv=Math.min((W-2*cw)*(W<700?0.86:0.5), 430); raiz.setProperty('--cv',cv+'px'); CV={cv:cv,ch:cv*450/580,ph:ph};
  raiz.setProperty('--lw',Math.max(44,Math.min(W*0.07,76))+'px');
  haz.setAttribute('viewBox','0 0 '+W+' '+H);
}
medidas(); addEventListener('resize',medidas);
// ---------- Días que faltan (hora de México) ----------
(function(){
  var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Monterrey',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-');
  var q=new URLSearchParams(location.search).get('dias');
  var dias=q!==null?parseInt(q,10):Math.round((Date.UTC(2026,10,27)-Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000);
  var a=document.getElementById('cArriba'),n=document.getElementById('cNum'),b=document.getElementById('cAbajo');
  if(dias<=0){a.textContent='¡HOY ES';n.textContent='LA';b.textContent='POSADA!';}
  else{a.textContent=dias===1?'FALTA':'FALTAN';n.textContent=dias;b.textContent=dias===1?'DÍA':'DÍAS';}
})();
var car=document.getElementById('caravana'),cR1=document.getElementById('cR1'),cR2=document.getElementById('cR2');
var dCuerpo=document.getElementById('dCuerpo'),dCab=document.getElementById('dCab'),pD=document.getElementById('pD'),pT=document.getElementById('pT');
var bLibre=document.getElementById('bLibre'),cNumG=document.getElementById('cNumG'),botes=car.querySelectorAll('.bote');
// recorrido del duende: entra, se detiene, sale y regresa después
var CIC=20, ENT=0.8, LLEGA=5.2, PARA=8.2, SALE=12.8, cxPrev=null, giro=0, fasePaso=0, tPrev=null;
function estadoCaravana(T){
  var W=innerWidth, t=T%CIC, xi=-CV.cv*1.1, xc=(W-CV.cv)/2, xf=W+CV.cv*0.1, x, v=0;
  function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);}
  if(t<ENT){x=xi;}
  else if(t<LLEGA){var u=(t-ENT)/(LLEGA-ENT);x=xi+(xc-xi)*(1-Math.pow(1-u,2.2));v=1-u*0.85;}
  else if(t<PARA){x=xc;v=0;}
  else if(t<SALE){var u2=(t-PARA)/(SALE-PARA);x=xc+(xf-xc)*Math.pow(u2,1.8);v=0.25+u2*0.9;}
  else {x=xf;}
  return {x:x,v:Math.min(1,v),t:t,visible:t>=ENT&&t<SALE};
}
// ---------- Sonido navideño (se genera en el navegador) ----------
var AC=null, MASTER=null, RUIDO=null, sonidoOn=false, melodiaTimer=null, BUS=null, GEN=0;
function iniciarAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain(); MASTER.gain.value=0.7; MASTER.connect(AC.destination);
  var n=AC.sampleRate*0.5, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1; RUIDO=b;
}
// campanita tipo caja de música
function nota(f,t,dur,vol,destino){
  destino=destino||MASTER;
  [[1,1],[2.76,0.35],[5.4,0.12]].forEach(function(pz){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f*pz[0];
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*pz[1],t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur*(pz[0]>1?0.5:1));
    o.connect(g); g.connect(destino); o.start(t); o.stop(t+dur+0.05);
  });
}
// cascabeles
function cascabel(vol,t){
  t=t||AC.currentTime;
  for(var k=0;k<3;k++){
    var s=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain(), tk=t+k*0.028+Math.random()*0.01;
    s.buffer=RUIDO; bp.type='bandpass'; bp.frequency.value=6500+Math.random()*2500; bp.Q.value=2.2;
    g.gain.setValueAtTime(0.0001,tk); g.gain.exponentialRampToValueAtTime(0.22*vol,tk+0.003); g.gain.exponentialRampToValueAtTime(0.0001,tk+0.16);
    s.connect(bp); bp.connect(g); g.connect(MASTER); s.start(tk,Math.random()*0.3,0.2);
    nota(3200+Math.random()*1800,tk,0.12,0.03*vol);
  }
}
// "Jingle Bells" (dominio público) en caja de música, bajito y en bucle
var C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99;
var MELODIA=[[E5,1],[E5,1],[E5,2],[E5,1],[E5,1],[E5,2],[E5,1],[G5,1],[C5,1.5],[D5,.5],[E5,4],
  [F5,1],[F5,1],[F5,1.5],[F5,.5],[F5,1],[E5,1],[E5,1],[E5,.5],[E5,.5],[E5,1],[D5,1],[D5,1],[E5,1],[D5,2],[G5,2],
  [E5,1],[E5,1],[E5,2],[E5,1],[E5,1],[E5,2],[E5,1],[G5,1],[C5,1.5],[D5,.5],[E5,4],
  [F5,1],[F5,1],[F5,1.5],[F5,.5],[F5,1],[E5,1],[E5,1],[E5,.5],[E5,.5],[G5,1],[G5,1],[F5,1],[D5,1],[C5,4]];
// Cada vez que se activa el sonido, la música va por un "canal" nuevo.
// Al silenciar, ese canal se desconecta y las notas que ya estaban programadas ya no suenan.
function tocarMelodia(gen){

      '<li><span><b>Canjea tus puntos</b> por premios en la subasta.</span></li>'+
    '</ol>'+

  var inp=$('n'), btn=$('apEntrar');

  function enviar(){
    var a=inp.value.trim();
    if(!/^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ]{4,12}$/.test(a)){ $('apAyuda').textContent='Usa de 4 a 12 letras o números, sin espacios ni símbolos.'; $('apAyuda').className='ayuda error'; inp.focus(); return; }
    btn.disabled=true; btn.textContent='Registrando…';
    llamar({api:'registrar',clave:clave(),nombre:a,opcion:''},function(o){
      if(o&&o.confirmar){ confirmar(a,o.candidatos||[]); return; }
      if(!o||!o.nombre){ btn.disabled=false; btn.textContent='🎁 Unirme y sumar puntos'; $('apAyuda').textContent='No se pudo registrar, intenta de nuevo.'; $('apAyuda').className='ayuda error'; return; }

    },function(){ btn.disabled=false; btn.textContent='🎁 Unirme y sumar puntos'; aviso('Sin conexión. Intenta de nuevo.'); });
  }

}

var AUD=null, colaAvisos=[], avisoAbierto=false;
function prepararAudio(){ try{ if(!AUD) AUD=new (window.AudioContext||window.webkitAudioContext)(); if(AUD.state==='suspended') AUD.resume(); }catch(e){} }
['pointerdown','touchend','keydown'].forEach(function(ev){ document.addEventListener(ev,prepararAudio,{passive:true}); });
function campanita(){
  if(!AUD) return; try{
    var t=AUD.currentTime, g=AUD.createGain(); g.gain.value=0.6; g.connect(AUD.destination);
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){ var o=AUD.createOscillator(), e=AUD.createGain(); o.type='sine'; o.frequency.value=f;
      e.gain.setValueAtTime(0.0001,t+i*0.11); e.gain.exponentialRampToValueAtTime(0.25,t+i*0.11+0.01); e.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+0.9);
      o.connect(e); e.connect(g); o.start(t+i*0.11); o.stop(t+i*0.11+1); });
  }catch(e){}
}
function notificar(s){ colaAvisos.push(s); if(!avisoAbierto) siguienteAviso(); }
function siguienteAviso(){
  var s=colaAvisos.shift(); if(!s){ avisoAbierto=false; return; } avisoAbierto=true;
  var t=TILES.filter(function(x){return x.s===s;})[0];
  var d=document.createElement('div'); d.className='ap-notif'; d.setAttribute('role','alertdialog'); d.setAttribute('aria-labelledby','apNotifT');
  d.innerHTML='<div class="ap-notif-caja"><div class="ap-notif-cab">🔓 ¡NUEVO EN LA POSADA!</div><div class="ap-notif-ico">'+(s==='qr'?QR_ICONO:t.ico)+'</div>'+
    '<h3 id="apNotifT">'+t.nTit+'</h3><p>'+t.nTxt+'</p><button class="boton" type="button" data-ir="1">Ir ahora</button><button class="boton secundario" type="button">Después</button></div>';
  $('appPosada').appendChild(d); confeti(); campanita(); if(navigator.vibrate) try{navigator.vibrate([120,80,120]);}catch(e){}
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){ try{ new Notification('Posada Navideña',{body:t.nTit,icon:'apple-touch-icon.png'}); }catch(e){} }
  var cerrar=function(ir){ d.remove(); if(ir){ colaAvisos=[]; avisoAbierto=false; abrir(s); } else siguienteAviso(); };
  d.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ cerrar(b.getAttribute('data-ir')==='1'); }; });
  setTimeout(function(){ var y=d.querySelector('[data-ir]'); if(y) y.focus(); },50);
}

var stream=null, bucle=0, ultimoLeido=0;
function detenerCamara(){ if(bucle) cancelAnimationFrame(bucle); bucle=0; if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
function escaner(){
  vista='qr'; verEscena('');
  poner(volver()+
    '<h2 class="ap-titsec">Escanea un código QR</h2>'+

    '<button class="ap-link" id="apManual" type="button">⌨️ ¿No funciona la cámara? Escribe el código</button>'+
    '<div id="apManualBox" hidden><input class="ap-campo2" id="apCodigo" placeholder="Ej. COCINA" autocapitalize="characters" autocomplete="off" spellcheck="false">'+

  $('apCodigo').onkeydown=function(e){ if(e.key==='Enter') $('apEnviarCod').click(); };
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ sinCamara('Este celular no permite abrir la cámara aquí. Escribe el código abajo.'); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
    if(vista!=='qr'){ s.getTracks().forEach(function(t){t.stop();}); return; }
    stream=s; var v=$('apVideo'); v.srcObject=s; v.setAttribute('playsinline',''); var p=v.play(); if(p&&p.catch) p.catch(function(){});
    $('apCamTxt').textContent=''; leer();
  }).catch(function(){ sinCamara('No pudimos abrir la cámara. Revisa que esta app tenga permiso de cámara, o escribe el código abajo.'); });
}
function sinCamara(t){ var x=$('apCamTxt'); if(x){ x.textContent=t; x.classList.add('err'); } var m=$('apManualBox'); if(m) m.hidden=false; }
function leer(){
  var v=$('apVideo'), cv=$('apCanvas'); if(!v||!cv) return; var ctx=cv.getContext('2d',{willReadFrequently:true});
  function paso(ts){
    if(vista!=='qr'||!stream) return;
    bucle=requestAnimationFrame(paso);

    var w=Math.min(640,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth); cv.width=w; cv.height=h; ctx.drawImage(v,0,0,w,h);
    var img=ctx.getImageData(0,0,w,h), r=window.jsQR&&jsQR(img.data,w,h,{inversionAttempts:'attemptBoth'});
    if(r&&r.data) leido(r.data);

function codigoDe(txt){

  return /^[A-Za-z0-9_-]{2,40}$/.test(txt)?txt.toUpperCase():null;

;\n}\nhtml{background:var(--pino)}\n\n/* Nieve */\n#nieve{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}\n.copo{position:absolute;top:-12px;color:#fff;opacity:.85;animation:nevar linear infinite}\n@keyframes nevar{to{transform:translate(var(--dx),105vh) rotate(360deg)}}\n\n/* Esferas colgantes */\n.esferas{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;position:relative;z-index:2}\n.esfera{transform-box:view-box;animation:columpio 3.6s ease-in-out infinite}\n@keyframes columpio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}\n\n.hoja{max-width:440px;margin:0 auto;padding:0 18px;position:relative;z-index:2}\n\n/* Escena */\n.escena{display:block;width:100%;height:auto;margin:-18px 0 0}\n.arbol{transform-box:view-box;transform-origin:180px 216px;animation:crecer 1.1s cubic-bezier(.2,1.3,.4,1) both}\n@keyframes crecer{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}\n.estrella{transform-box:view-box;transform-origin:180px 46px;\n  animation:aparece .5s 1s cubic-bezier(.2,1.6,.4,1) both,brilla 1.8s 1.5s ease-in-out infinite}\n@keyframes aparece{from{transform:scale(0)}to{transform:scale(1)}}\n@keyframes brilla{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px #f2c14e)}50%{transform:scale(1.15);filter:drop-shadow(0 0 10px #ffe08a)}}\n.luz{animation:parpadeo 1.2s ease-in-out infinite}\n@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:.25}}\n.santa{animation:llega-der .9s .5s cubic-bezier(.2,1.2,.4,1) both}\n.santa-cuerpo{animation:rebote 1.6s 1.4s ease-in-out infinite}\n@keyframes llega-der{from{transform:translateX(140px);opacity:0}to{transform:none;opacity:1}}\n@keyframes rebote{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}\n.mano{transform-box:view-box;transform-origin:309px 160px;animation:saludo .7s 1.4s ease-in-out infinite alternate}\n@keyframes saludo{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}\n.reno{animation:llega-izq .9s .7s cubic-bezier(.2,1.2,.4,1) both}\n@keyframes llega-izq{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}\n.cabeza{transform-box:view-box;transform-origin:96px 176px;animation:asiente 2.4s 1.6s ease-in-out infinite}\n@keyframes asiente{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}\n\n.mono{transform-box:view-box;transform-origin:180px 222px;animation:crecer .8s cubic-bezier(.2,1.3,.4,1) both}\n.mono-cabeza{transform-box:view-box;transform-origin:180px 98px;animation:niega .9s .8s ease-in-out infinite}\n@keyframes niega{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}\n.globo{transform-box:view-box;transform-origin:240px 86px;animation:aparece .45s .9s cubic-bezier(.2,1.6,.4,1) both}\n.mono-regalos{animation:llega-izq .8s .3s cubic-bezier(.2,1.2,.4,1) both}\n\n.nino-salta{transform-box:fill-box;transform-origin:50% 100%;animation:saltar .9s ease-in-out infinite}\n@keyframes saltar{0%,100%{transform:translateY(0) scaleY(.92)}12%{transform:translateY(0) scaleY(1)}\n  50%{transform:translateY(-36px) scaleY(1.04)}88%{transform:translateY(0) scaleY(1)}}\n.nino-sombra{transform-box:fill-box;transform-origin:50% 50%;animation:sombra .9s ease-in-out infinite}\n@keyframes sombra{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.5);opacity:.35}}\n.nino-brazo{transform-box:fill-box;animation:agita .45s ease-in-out infinite alternate}\n.nino-brazo.izq{transform-origin:100% 100%}.nino-brazo.der{transform-origin:0% 100%}\n@keyframes agita{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}\n\n.estrella-chica{transform-box:fill-box;transform-origin:50% 50%;animation:brilla 1.8s ease-in-out infinite}\n\n/* Fondo blanco al ganar puntos */\nhtml,body{transition:background-color .4s}\nhtml.blanca,body.blanca{background:#fff}\nbody.blanca .hero h1{color:var(--rojo);text-shadow:0 3px 0 #f2c14e}\nbody.blanca .copo{color:#a9c6dc}\nbody.blanca .nota{color:var(--suave)}\n\n.santa-lee{animation:rebote 2s ease-in-out infinite}\n.carta{transform-box:fill-box;transform-origin:20% 80%;animation:lee 2.4s ease-in-out infinite}\n@keyframes lee{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}\n.escaner{animation:escanea 1.3s ease-in-out infinite alternate}\n@keyframes escanea{from{transform:translateY(0)}to{transform:translateY(32px)}}\n.duende{animation:rebote 1.2s ease-in-out infinite}\n.duende-cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:asiente 2s ease-in-out infinite}\n.duende-brazo{transform-box:fill-box;transform-origin:0% 10%;animation:lee 2s ease-in-out infinite}\n.revisando{text-align:center;padding:10px 0 30px}\n.revisando .t{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.35;color:#fff;\n  letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.35)}\n.revisando .puntitos{display:inline-flex;gap:6px;margin-top:12px}\n.revisando .puntitos i{width:10px;height:10px;border-radius:50%;background:var(--oro);animation:pulso 1s ease-in-out infinite}\n.revisando .puntitos i:nth-child(2){background:#fff;animation-delay:.15s}\n.revisando .puntitos i:nth-child(3){background:var(--rojo);animation-delay:.3s}\n@keyframes pulso{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}\n\n.hero{text-align:center;margin:0 0 20px}\n.separador{height:24px}\n.hero .lugar{font-family:\"Mountains of Christmas\",cursive;color:var(--oro);font-size:30px;margin:0;line-height:1}\n.hero h1{font-family:\"Mountains of Christmas\",cursive;font-weight:700;font-size:clamp(36px,11vw,52px);line-height:1;\n  margin:4px 0 0;text-shadow:0 3px 0 var(--rojo2);text-wrap:balance}\n\n/* Tarjetas */\n.tarjeta{position:relative;background:var(--nieve);color:var(--tinta);border-radius:22px;padding:30px 22px 24px;\n  overflow:hidden;box-shadow:0 22px 40px -18px rgba(0,0,0,.6)}\n.tarjeta::before{content:\"\";position:absolute;left:0;right:0;top:0;height:10px;\n  background:repeating-linear-gradient(-45deg,var(--roj \"22\" fill=\"#fff\"/><rect x=\"128\" y=\"208\" width=\"28\" height=\"5\" fill=\"#fff\"/>\n      <rect x=\"204\" y=\"196\" width=\"30\" height=\"26\" rx=\"3\" fill=\"#f2c14e\"/>\n      <rect x=\"216\" y=\"196\" width=\"6\" height=\"26\" fill=\"#c8102e\"/><rect x=\"204\" y=\"206\" width=\"30\" height=\"5\" fill=\"#c8102e\"/>\n    <\/g>\n\n    <!-- Santa -->\n    <g class=\"santa\"><g class=\"santa-cuerpo\">\n      <rect x=\"268\" y=\"204\" width=\"14\" height=\"13\" rx=\"4\" fill=\"#222\"/>\n      <rect x=\"288\" y=\"204\" width=\"14\" height=\"13\" rx=\"4\" fill=\"#222\"/>\n      <ellipse cx=\"259\" cy=\"180\" rx=\"8\" ry=\"15\" fill=\"#c8102e\" transform=\"rotate(14 259 180)\"/>\n      <circle cx=\"255\" cy=\"194\" r=\"6.5\" fill=\"#1f7a4d\"/>\n      <ellipse cx=\"285\" cy=\"180\" rx=\"28\" ry=\"31\" fill=\"#c8102e\"/>\n      <rect x=\"259\" y=\"198\" width=\"52\" height=\"8\" rx=\"4\" fill=\"#fff\"/>\n      <rect x=\"282\" y=\"150\" width=\"6\" height=\"48\" fill=\"#fff\"/>\n      <rect x=\"257\" y=\"176\" width=\"56\" height=\"9\" fill=\"#222\"/>\n      <rect x=\"278\" y=\"174\" width=\"14\" height=\"13\" rx=\"2\" fill=\"none\" stroke=\"#f2c14e\" stroke-width=\"3\"/>\n      <g class=\"mano\">\n        <rect x=\"303\" y=\"130\" width=\"12\" height=\"34\" rx=\"6\" fill=\"#c8102e\"/>\n        <rect x=\"302\" y=\"133\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#fff\"/>\n        <circle cx=\"309\" cy=\"127\" r=\"7.5\" fill=\"#1f7a4d\"/>\n      <\/g>\n      <circle cx=\"285\" cy=\"128\" r=\"18\" fill=\"#f6c9a8\"/>\n      <circle cx=\"275\" cy=\"133\" r=\"4\" fill=\"#f4a3a0\" opacity=\".7\"/><circle cx=\"295\" cy=\"133\" r=\"4\" fill=\"#f4a3a0\" opacity=\".7\"/>\n      <path d=\"M266 130 Q267 162 285 168 Q303 162 304 130 Q296 142 285 142 Q274 142 266 130Z\" fill=\"#fff\"/>\n      <ellipse cx=\"279\" cy=\"139\" rx=\"7.5\" ry=\"4\" fill=\"#fff\"/><ellipse cx=\"291\" cy=\"139\" rx=\"7.5\" ry=\"4\" fill=\"#f4f4f4\"/>\n      <circle cx=\"285\" cy=\"134\" r=\"3.6\" fill=\"#e88f7a\"/>\n      <circle cx=\"279\" cy=\"126\" r=\"2.1\" fill=\"#222\"/><circle cx=\"291\" cy=\"126\" r=\"2.1\" fill=\"#222\"/>\n      <path d=\"M268 117 Q284 84 314 102 L302 118Z\" fill=\"#c8102e\"/>\n      <rect x=\"264\" y=\"111\" width=\"42\" height=\"10\" rx=\"5\" fill=\"#fff\"/>\n      <circle cx=\"315\" cy=\"104\" r=\"7\" fill=\"#fff\"/>\n    <\/g><\/g>\n  <\/svg>\n  <div class=\"hero\">\n    <h1 class=\"titulo-juego\" aria-label=\"Mural navideño\">\n      <span class=\"linea\"><span class=\"a\">M<svg viewBox=\"0 0 60 40\" aria-hidden=\"true\"><path d=\"M6 32 Q22 0 52 14 L42 32Z\" fill=\"#c8102e\"/><rect x=\"2\" y=\"28\" width=\"46\" height=\"10\" rx=\"5\" fill=\"#fff\"/><circle cx=\"53\" cy=\"15\" r=\"6\" fill=\"#fff\"/><\/svg><\/span>ural<\/span>\n      <span class=\"linea\">navideño<\/span>\n    <\/h1>\n    <p class=\"lema\">Tómate una foto, ponle un marco navideño y un mensaje, y míralo aparecer en la pantalla grande<\/p>\n  <\/div>\n  <ol class=\"pasos\">\n    <li><span><b>Tómate una foto<\/b> o elige solo una tarjeta si prefieres no salir.<\/span><\/li>\n    <li><span><b>Elige tu marco,<\/b> agrega stickers y escribe tu frase navideña.<\/span><\/li>\n    <li><span><b>Proyéctala en el mural<\/b> o descárgala para tu historia de Instagram.<\/span><\/li>\n  <\/ol>\n<\/div>\n<div class=\"col-ajustes\">\n  <section class=\"tarjeta t-pantalla\">\n    <h2>Panel del anfitrión<\/h2>\n    <p>Desde aquí controlas el mural. Los invitados <b>no ven esta pantalla<\/b>: ellos entran con el código QR directo a la cabina de fotos.<\/p>\n    <div class=\"opciones-pantalla\">\n      <button class=\"op-pantalla principal\" id=\"irMural\" type=\"button\"><span class=\"ico-g\">📽️<\/span><b>Proyectar el mural<\/b><small>Para el proyector o la pantalla: muestra todas las fotos y mensajes en movimiento, con el QR para los invitados.<\/small><\/button>\n      <button class=\"op-pantalla\" id=\"verQR\" type=\"button\"><span class=\"ico-g\">🔳<\/span><b>QR para invitados<\/b><small>Muéstralo en grande o imprímelo para ponerlo en las mesas.<\/small><\/button>\n      <button class=\"op-pantalla\" id=\"irCabina\" type=\"button\"><span class=\"ico-g\">📸<\/span><b>Probar la cabina<\/b><small>Mira lo mismo que verán los invitados y haz una foto de prueba.<\/small><\/button>\n      <button class=\"op-pantalla\" id=\"bloquear\" type=\"button\"><span class=\"ico-g\">🔒<\/span><b>Bloquear panel<\/b><small>Vuelve a pedir el PIN si vas a dejar la laptop sola.<\/small><\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"tarjeta t-evento\">\n    <h2>Tu evento<\/h2>\n    <span class=\"subtitulo\">Fondo del mural<\/span>\n    <div class=\"chips\" role=\"radiogroup\" aria-label=\"Fondo del mural\">\n      <label><input type=\"radio\" name=\"fondoMural\" value=\"pizarron\"><span>🖍️ Pizarrón<\/span><\/label>\n      <label><input type=\"radio\" name=\"fondoMural\" value=\"polo\"><span>🌌 Polo Norte<\/span><\/label>\n    <\/div>\n    <p>Aparece en el mural y en la historia de Instagram.<\/p>\n    <label class=\"campo-mini\" for=\"cfgEvento\">Nombre del evento<\/label>\n    <input class=\"entrada\" id=\"cfgEvento\" type=\"text\" maxlength=\"36\" placeholder=\"Ej. Posada García 2026\">\n    <label class=\"campo-mini\" for=\"cfgHashtag\">Hashtag<\/label>\n    <input class=\"entrada\" id=\"cfgHashtag\" type=\"text\" maxlength=\"30\" placeholder=\"#NavidadEnFamilia\">\n    <input id=\"cfgMarca\" type=\"hidden\">\n    <label class=\"campo-mini\" for=\"cfgLink\">Link para invitados (para el código QR)<\/label>\n    <input class=\"entrada\" id=\"cfgLink\" type=\"url\" placeholder=\"Pega aquí el link de esta página\">\n    <p class=\"ayuda\">Si compartes esta página con un link, pégalo aquí y el mural mostrará un QR para que los invitados entren directo a la cabina.<\/p>\n    <p class=\"cfg-estado\" id=\"cfgEstado\" role=\"status\"><\/p>\n  <\/section>\n\n  <section class=\"tarjeta t-conexion\">\n    <h2>Conexión<\/h2>\n    <div class=\"estado-conexion\" id=\"estadoConexion\"><\/div>\n  <\/section>\n<\/div>\n<\/main>\n\n<!-- ============ CABINA ============ -->\n<section class=\"elegir\" id=\"elegir\" hidden>\n  <span class=\"cab-evento\" id=\"eleEvento\"><\/span>\n  <div class=\"registro\" id=\"registro\" hidden>\n    <h1 class=\"elegir-titulo\">¡Bienvenido!<\/h1>\n    <p class=\"elegir-sub\">Antes de empezar, dinos cómo te llamas. Solo te lo preguntamos una vez.<\/p>\n    <section class=\"tarjeta registro-tarjeta\">\n      <label class=\"campo-mini\" for=\"regNombre\">Tu nombre<\/label>\n      <input class=\"entrada\" id=\"regNombre\" type=\"text\" maxlength=\"24\" placeholder=\"Ej. Ana y familia\" autocomplete=\"given-name\" enterkeyhint=\"go\">\n      <p class=\"ayuda error\" id=\"regError\" role=\"alert\"><\/p>\n      <button class=\"boton\" id=\"regOk\" type=\"button\">🎄 Continuar<\/button>\n    <\/section>\n  <\/div>\n  <div id=\"opcionesInv\">\n  <p class=\"saludo\" id=\"saludo\"><\/p>\n  <h1 class=\"elegir-titulo\">¿Qué quieres hacer?<\/h1>\n  <p class=\"elegir-sub\">Lo que envíes aparecerá en la pantalla grande del evento 🎄<\/p>\n  <div class=\"elegir-ops\">\n    <button class=\"ele-op op-foto\" id=\"opFoto\" type=\"button\"><span class=\"ele-ilus\" aria-hidden=\"true\">📸<\/span>\n      <span class=\"ele-txt\"><b>Subir foto al mural<\/b><small>Tómate una foto o súbela de tu galería, elige un marco navideño y escribe tu mensaje.<\/small><\/span><span class=\"ele-flecha\" aria-hidden=\"true\">›<\/span><\/button>\n    <button class=\"ele-op op-carta\" id=\"opCarta\" type=\"button\"><span class=\"ele-ilus\" aria-hidden=\"true\"><span>💌<\/span><\/span>\n      <span class=\"ele-txt\"><b>Colocar frase en el mural<\/b><small>Escribe una carta navideña con tus buenos deseos para todos.<\/small><\/span><span class=\"ele-flecha\" aria-hidden=\"true\">›<\/span><\/button>\n  <\/div>\n  <p class=\"ele-nota\">También puedes descargar tu foto o tu carta para tu historia de Instagram 📲<\/p>\n  <\/div>\n  <button class=\"boton secundario mini\" id=\"eleVolver\" type=\"button\">← Panel del anfitrión<\/button>\n<\/section>\n\n<section class=\"cabina\" id=\"carta\" hidden>\n  <div class=\"cab-barra\">\n    <div><span class=\"cab-evento\" id=\"cartaEvento\"><\/span><div class=\"cab-titulo\">💌 Carta navideña<\/div><\/div>\n    <button class=\"boton secundario mini\" id=\"cartaVolver\" type=\"button\">← Opciones<\/button>\n  <\/div>\n  <div class=\"cab-grid\">\n    <div class=\"vista\">\n      <div class=\"lienzo-wrap carta-wrap\"><canvas id=\"lienzoCarta\" width=\"540\" height=\"675\" aria-label=\"Vista previa de tu carta navideña\"><\/canvas><\/div>\n    <\/div>\n    <div class=\"pasos-cab\">\n      <section class=\"tarjeta\">\n        <h2><span class=\"num-paso\">1<\/span>Escribe tu carta<\/h2>\n        <input id=\"cartaPara\" type=\"hidden\" value=\"\">\n        <label class=\"campo-mini\" for=\"cartaMsg\">Tu mensaje<\/label>\n        <textarea class=\"area\" id=\"cartaMsg\" maxlength=\"60\" placeholder=\"Escribe aquí tus buenos deseos…\"><\/textarea>\n        <div class=\"contador\" id=\"contCarta\">0/60<\/div>\n        <div class=\"sugerencias\" id=\"sugCarta\"><\/div>\n        <label class=\"campo-mini\" for=\"cartaFirma\">Nombre <span class=\"opcional\">(opcional)<\/span><\/label>\n        <input class=\"entrada\" id=\"cartaFirma\" type=\"text\" maxlength=\"14\" placeholder=\"Ej. Tía Rosa\" autocomplete=\"off\">\n        <div class=\"contador\" id=\"contFirma\">0/14<\/div>\n\n      <\/section>\n      <section class=\"tarjeta\">\n        <h2><span class=\"num-paso\">2<\/span>Elige la estampilla<\/h2>\n        <div class=\"stickers sellos\" id=\"sellos\"><\/div>\n        <p class=\"desliza\">Desliza para ver todas las estampillas →<\/p>\n      <\/section>\n      <div class=\"accion-cabina\">\n        <p class=\"ayuda error\" id=\"errorCarta\" role=\"alert\" style=\"text-align:center;color:#ffd1d8 !important\"><\/p>\n        <div class=\"fila\">\n          <button class=\"boton secundario\" id=\"btnHistoriaCarta\" type=\"button\">📲 Historia<\/button>\n          <button class=\"boton secundario\" id=\"btnDescargarCarta\" type=\"button\">⬇️ Guardar<\/button>\n          <button class=\"boton proyectar\" id=\"btnProyectarCarta\" type=\"button\">💌 Enviar al mural<\/button>\n        <\/div>\n        <p class=\"aviso-privado\">Al enviarla, tu carta se guarda en línea y se verá en la pantalla del evento.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cabina\" id=\"cabina\" hidden>\n  <div class=\"cab-barra\">\n    <div><span class=\"cab-evento\" id=\"cabEvento\"><\/span><div class=\"cab-titulo\">📸 Cabina navideña<\/div><\/div>\n    <button class=\"boton secundario mini\" id=\"cabSalir\" type=\"button\">← Panel<\/button>\n  <\/div>\n  <p class=\"bienvenida\">¡Hola! Tómate una foto o súbela de tu galería, desliza para elegir tu marco navideño y proyéctala en la pantalla grande.<\/p>\n  <div class=\"cab-grid\">\n    <div class=\"vista\">\n      <div class=\"lienzo-wrap\" id=\"lienzoWrap\">\n        <canvas id=\"lienzo\" width=\"540\" height=\"675\" aria-label=\"Vista previa de tu foto con marco\"><\/canvas>\n        <div class=\"camara-msg\" id=\"camaraMsg\" hidden><\/div>\n        <div class=\"cuenta-atras\" id=\"cuentaAtras\" hidden><\/div>\n        <div class=\"flash\" id=\"flash\"><\/div>\n        <button class=\"flecha-foto izq\" id=\"marcoPrev\" type=\"button\" aria-label=\"Marco anterior\">‹<\/button>\n        <button class=\"flecha-foto der\" id=\"marcoSig\" type=\"button\" aria-label=\"Marco siguiente\">›<\/button>\n        <div class=\"controles-foto\">\n          <div class=\"disparo\">\n            <button class=\"btn-redondo\" id=\"btnGaleria\" type=\"button\" aria-label=\"Subir foto de la galería\">🖼️<\/button>\n            <button class=\"obturador\" id=\"btnObturador\" type=\"button\" aria-label=\"Tomar foto\">📷<\/button>\n            <button class=\"btn-redondo\" id=\"btnVoltear\" type=\"button\" aria-label=\"Cambiar de cámara\">🔄<\/button>\n          <\/div>\n          <div class=\"etiquetas-disparo\"><span>Galería<\/span><span id=\"lblObturador\">Abrir cámara<\/span><span>Voltear<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"selector-marco\" aria-live=\"polite\">\n        <span class=\"marco-nombre\" id=\"marcoNombre\">Fiesta navideña<\/span>\n        <div class=\"marco-puntos\" id=\"marcoPuntos\" role=\"tablist\" aria-label=\"Marcos\"><\/div>\n        <p class=\"desliza-foto\">👆 Desliza la foto a los lados para cambiar de marco<\/p>\n      <\/div>\n      <button class=\"btn-texto\" id=\"btnSinFoto\" type=\"button\" hidden>🎄 Prefiero no salir: solo tarjeta con marco<\/button>\n      <input type=\"file\" id=\"archivo\" accept=\"image/*\" hidden>\n      <video id=\"video\" playsinline muted autoplay hidden><\/video>\n    <\/div>\n\n    <div class=\"pasos-cab\">\n      <div hidden><div id=\"marcos\"><\/div><button id=\"marcosIzq\"><\/button><button id=\"marcosDer\"><\/button><div id=\"bloqueDibujos\"><div id=\"dibujos\"><\/div><\/div><\/div>\n      <section class=\"tarjeta\">\n        <h2>💬 Agrega un comentario<\/h2>\n        <input id=\"nombre\" type=\"hidden\">\n\n        <label class=\"campo-mini\" for=\"mensaje\">Tu mensaje <span class=\"opcional\">(opcional)<\/span><\/label>\n        <textarea class=\"area\" id=\"mensaje\" maxlength=\"90\" placeholder=\"¡Feliz Navidad a todos!\"><\/textarea>\n        <div class=\"contador\" id=\"contador\">0/90<\/div>\n        <div class=\"sugerencias\" id=\"sugerencias\"><\/div>\n      <\/section>\n      <div class=\"accion-cabina\">\n        <p class=\"ayuda error\" id=\"errorCabina\" role=\"alert\" style=\"text-align:center;color:#ffd1d8 !important\"><\/p>\n        <div class=\"fila\">\n          <button class=\"boton secundario\" id=\"btnHistoria\" type=\"button\">📲 Historia<\/button>\n          <button class=\"boton secundario\" id=\"btnDescargar\" type=\"button\">⬇️ Guardar<\/button>\n          <button class=\"boton proyectar\" id=\"btnProyectar\" type=\"button\">📽️ Proyectar<\/button>\n        <\/div>\n        <p class=\"aviso-privado\" id=\"avisoPrivado\">Al proyectar, tu foto y mensaje se guardan en línea y se verán en la pantalla del evento.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ MURAL ============ -->\n<section class=\"mural\" id=\"mural\" hidden>\n  <div class=\"fondo-mural\" id=\"fondoMural\" aria-hidden=\"true\"><\/div>\n  <header class=\"mural-cab\">\n    <div class=\"evento\" id=\"muralEvento\">Mural navideño<\/div>\n    <div class=\"scanme\" id=\"qrCaja\" hidden><div class=\"qr\" id=\"qr\" aria-label=\"Código QR para subir fotos y cartas al mural\"><\/div><span>SCAN ME<\/span><\/div>\n  <\/header>\n  <div class=\"collage\" id=\"collage\">\n    <div class=\"vacio-mural\" id=\"vacioMural\">\n      <div class=\"tarjeta-vacia\"><div class=\"vacia-int\"><div><div class=\"g\">📸<\/div><b>¡Sé el primero en aparecer aquí!<\/b><p>Escanea el código <b>SCAN ME<\/b> y sube tu foto o tu carta navideña<\/p><\/div><\/div><\/div>\n    <\/div>\n    <div class=\"foco\" id=\"foco\" hidden><\/div>\n  <\/div>\n  <div class=\"host\" role=\"toolbar\" aria-label=\"Controles del anfitrión\">\n    <button class=\"boton secundario\" id=\"hCabina\" type=\"button\">📸 Tomar foto aquí<\/button>\n    <button class=\"boton secundario\" id=\"hPausa\" type=\"button\" aria-pressed=\"false\">⏸ Pausar<\/button>\n    <button class=\"boton secundario\" id=\"hModerar\" type=\"button\" aria-pressed=\"false\">🗑️ Moderar<\/button>\n    <button class=\"boton secundario\" id=\"hFondo\" type=\"button\">🎨 Fondo<\/button>\n    <button class=\"boton secundario\" id=\"hLimpiar\" type=\"button\">🧹 Restablecer<\/button>\n    <button class=\"boton secundario\" id=\"hPantalla\" type=\"button\">⛶ Pantalla completa<\/button>\n    <button class=\"boton secundario\" id=\"hInicio\" type=\"button\">⚙️ Panel<\/button>\n  <\/div>\n<\/section>\n\n<!-- ============ CANDADO DEL ANFITRIÓN ============ -->\n<div class=\"capa candado\" id=\"capaPin\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pinTitulo\">\n  <section class=\"tarjeta\">\n    <h2 id=\"pinTitulo\">🔒 Zona del anfitrión<\/h2>\n    <p>Escribe el PIN para abrir el mural y su configuración.<\/p>\n    <input class=\"pin-input\" id=\"pinInput\" type=\"password\" inputmode=\"numeric\" autocomplete=\"off\" maxlength=\"8\" aria-label=\"PIN del anfitrión\">\n    <p class=\"ayuda error\" id=\"pinError\" role=\"alert\"><\/p>\n    <button class=\"boton\" id=\"pinEntrar\" type=\"button\">Entrar<\/button>\n    <button class=\"soy-invitado\" id=\"soyInvitado\" type=\"button\">¿Eres invitado? Ir a la cabina de fotos 📸<\/button>\n  <\/section>\n<\/div>\n\n<!-- ============ QR PARA INVITADOS ============ -->\n<div class=\"capa\" id=\"capaQR\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"qrTitulo\">\n  <section class=\"tarjeta qr-grande\">\n    <h2 id=\"qrTitulo\">📸 ¡Tómate una foto navideña!<\/h2>\n    <p id=\"qrEvento\"><\/p>\n    <div class=\"qr-xl\" id=\"qrXL\" aria-label=\"Código QR para entrar a la cabina de fotos\"><\/div>\n    <p class=\"link-txt\" id=\"qrLink\"><\/p>\n    <ol class=\"pasos-qr\">\n      <li>1️⃣ Escanea el código con la cámara de tu celular<\/li>\n      <li>2️⃣ Sube tu foto con marco navideño o escribe una carta<\/li>\n      <li>3️⃣ ¡Proyéctala en la pantalla grande!<\/li>\n    <\/ol>\n    <div class=\"acciones-qr\">\n      <button class=\"boton secundario\" id=\"cerrarQR\" type=\"button\">Cerrar<\/button>\n      <button class=\"boton\" id=\"imprimirQR\" type=\"button\">🖨️ Imprimir<\/button>\n    <\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ CONFIRMAR LIMPIEZA DEL MURAL ============ -->\n<div class=\"capa\" id=\"capaLimpiar\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"limpiarTitulo\">\n  <section class=\"tarjeta limpiar-tarjeta\">\n    <div class=\"limpiar-ico\" aria-hidden=\"true\">🧹<\/div>\n    <h2 id=\"limpiarTitulo\">¿Deseas dejar limpio el tablero?<\/h2>\n    <p>Se quitarán <b>todas las fotos y cartas<\/b> del mural, en todas las pantallas donde esté abierto. Las fotos seguirán guardadas en tu Supabase por si quieres descargarlas después.<\/p>\n    <p class=\"ayuda error\" id=\"limpiarError\" role=\"alert\"><\/p>\n    <div class=\"hist-acciones\">\n      <button class=\"boton secundario\" id=\"limpiarNo\" type=\"button\">Cancelar<\/button>\n      <button class=\"boton\" id=\"limpiarSi\" type=\"button\">Sí, dejar limpio<\/button>\n    <\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ VISTA PREVIA DE LA HISTORIA ============ -->\n<div class=\"capa\" id=\"capaHistoria\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"histTitulo\">\n  <section class=\"tarjeta hist-tarjeta\">\n    <h2 id=\"histTitulo\">📲 Tu historia de Instagram<\/h2>\n    <p class=\"hist-ayuda\">Así se verá. Guárdala o compártela directo a Instagram.<\/p>\n    <div class=\"hist-vista\"><img id=\"histImg\" alt=\"Vista previa de tu historia de Instagram\"><\/div>\n    <div class=\"hist-acciones\">\n      <button class=\"boton secundario\" id=\"histCerrar\" type=\"button\">Cerrar<\/button>\n      <button class=\"boton\" id=\"histCompartir\" type=\"button\">📲 Compartir o guardar<\/button>\n    <\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ CAPA ÉXITO ============ -->\n<div class=\"capa\" id=\"capaExito\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"exitoTitulo\">\n  <section class=\"tarjeta exito\">\n    <div class=\"estado grande ok\">\n      <span class=\"timbre\" aria-hidden=\"true\">🎄<\/span>\n      <div class=\"ico\">📽️<\/div>\n      <div><div class=\"t\" id=\"exitoTitulo\">¡Ya estás en el mural!<\/div><div class=\"s\" id=\"exitoSub\">Mira la pantalla grande<\/div><\/div>\n    <\/div>\n    <button class=\"boton\" id=\"exitoHistoria\" type=\"button\">📲 Descargar para mi historia<\/button>\n    <button class=\"boton secundario\" id=\"exitoOtra\" type=\"button\">📸 Tomar otra foto<\/button>\n    <button class=\"boton secundario\" id=\"exitoOpciones\" type=\"button\">🏠 Volver a las opciones<\/button>\n  <\/section>\n<\/div>\n\n<script>\n(function () {\n/* ---------- Decoración (igual que la invitación) ---------- */\nvar GORRO = '<svg viewBox=\"0 0 60 40\" aria-hidden=\"true\"><path d=\"M6 32 Q22 0 52 14 L42 32Z\" fill=\"#c8102e\"/>' +\n  '<rect x=\"2\" y=\"28\" width=\"46\" height=\"10\" rx=\"5\" fill=\"#fff\"/><circle cx=\"53\" cy=\"15\" r=\"6\" fill=\"#fff\"/><\/svg>';\n\nfunction esferas() {\n  var svg = document.getElementById('esferas'), h = '';\n  var datos = [[24, 22, 13, '#c8102e'], [76, 40, 15, '#f2c14e'], [128, 18, 12, '#2f9e62'], [180, 46, 16, '#ffffff'],\n               [232, 18, 12, '#c8102e'], [284, 38, 15, '#d9dde3'], [336, 22, 13, '#2f9e62']];\n  datos.forEach(function (e, i) {\n    var x = e[0], largo = e[1], r = e[2], c = e[3], cy = largo + 8 + r;\n    h += '<g class=\"esfera\" style=\"transform-origin:' + x + 'px 0px;animation-delay:-' + (i * 0.5) + 's\">' +\n      '<line x1=\"' + x + '\" y1=\"0\" x2=\"' + x + '\" y2=\"' + (largo + 2) + '\" stroke=\"#f2c14e\" stroke-width=\"1.2\"/>' +\n      '<rect x=\"' + (x - 4) + '\" y=\"' + largo + '\" width=\"8\" height=\"8\" rx=\"1.5\" fill=\"#d4a63a\"/>' +\n      '<circle cx=\"' + x + '\" cy=\"' + cy + '\" r=\"' + r + '\" fill=\"' + c + '\"/>' +\n      '<path d=\"M' + (x - r) + ' ' + cy + ' Q' + x + ' ' + (cy + r * 0.45) + ' ' + (x + r) + ' ' + cy + '\" stroke=\"' +\n        (c === '#ffffff' ? '#c8102e' : '#ffffff') + '\" stroke-opacity=\".55\" stroke-width=\"2\" fill=\"none\"/>' +\n      '<ellipse cx=\"' + (x - r * 0.38) + '\" cy=\"' + (cy - r * 0.4) + '\" rx=\"' + (r * 0.28) + '\" ry=\"' + (r * 0.18) +\n        '\" fill=\"#fff\" opacity=\".7\" transform=\"rotate(-35 ' + (x - r * 0.38) + ' ' + (cy - r * 0.4) + ')\"/>' +\n      '<\/g>';\n  });\n  svg.innerHTML = h;\n}\n\nfunction nieve() {\n  var cont = document.getElementById('nieve');\n  for (var i = 0; i < 36; i++) {\n    var c = document.createElement('div');\n    c.className = 'copo';\n    c.textContent = Math.random() < 0.35 ? '❄' : '•';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.fontSize = (8 + Math.random() * 14) + 'px';\n    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');\n    c.style.animationDuration = (7 + Math.random() * 8) + 's';\n    c.style.animationDelay = -(Math.random() * 15) + 's';\n    cont.appendChild(c);\n  }\n}\n\nfunction confeti() {\n  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  var CF = ['#c8102e', '#f2c14e', '#2f9e62', '#ff4d4d', '#1f7a4d', '#b8c2cc'];\n  for (var i = 0; i < 90; i++) {\n    (function (i) {\n      setTimeout(function () {\n        var d = document.createElement('div');\n        d.className = 'conf';\n        d.style.left = Math.random() * 100 + 'vw';\n        d.style.background = CF[Math.floor(Math.random() * CF.length)];\n        var s = 6 + Math.random() * 8;\n        d.style.width = s + 'px'; d.style.height = (s * 1.6) + 'px';\n        if (Math.random() < .3) d.style.borderRadius = '50%';\n        var t = 2.5 + Math.random() * 2.5;\n        d.style.animationDuration = t + 's';\n        document.body.appendChild(d);\n        setTimeout(function () { d.remove(); }, t * 1000 + 100);\n      }, i * 40);\n    })(i);\n  }\n}\n\nfunction nino(x, piel, pelo, sueter, pantalon, extra, d) {\n  var s = 'animation-delay:' + d + 's';\n  var h = '<g transform=\"translate(' + x + ' 216)\">' +\n    '<ellipse class=\"nino-sombra\" style=\"' + s + '\" cx=\"0\" cy=\"2\" rx=\"16\" ry=\"4\" fill=\"rgba(30,40,60,.15)\"/>' +\n    '<g class=\"nino-salta\" style=\"' + s + '\">' +\n      '<rect x=\"-9\" y=\"-30\" width=\"7\" height=\"28\" rx=\"3\" fill=\"' + pantalon + '\"/>' +\n      '<rect x=\"2\" y=\"-30\" width=\"7\" height=\"28\" rx=\"3\" fill=\"' + pantalon + '\"/>' +\n      '<ellipse cx=\"-6\" cy=\"-2\" rx=\"6.5\" ry=\"3.5\" fill=\"#3a2a1a\"/><ellipse cx=\"6\" cy=\"-2\" rx=\"6.5\" ry=\"3.5\" fill=\"#3a2a1a\"/>' +\n      '<g class=\"nino- function mural(){

  window.__portalHash='#cabina';
  window.__volverMenu=cerrarMural;
  var cont=document.createElement('div'); cont.id='apMural'; cont.className='ap-mural';

function cerrarMural(){ var m=$('apMural'); if(m) m.remove(); inicio({}); }
addEventListener('message',function(e){ if(e.data&&e.data.portal==='menu'&&$('apMural')) cerrarMural(); });

/* ---------- Premios ---------- */
function premios(){
  vista='premios'; verEscena('');
  poner(volver()+'<h2 class="ap-titsec">🎁 Mis premios</h2>'+
    '<section class="tarjeta"><div class="ap-puntos" style="margin:0;padding:0;border:0"><b id="apPts2">'+fmt((datos||{}).total)+'</b><span>puntos disponibles</span></div>'+
    '<p class="ap-mini">'+mini(datos||{})+'</p></section>'+
    '<section class="tarjeta ap-lista" id="apLista"><p class="ap-mini">Cargando tus premios…</p></section>');
  $('apVolver').onclick=function(){ inicio({}); };
  cargarPremios();
}
function cargarPremios(){
  llamar({api:'premios',clave:clave()},function(o){
    if(vista!=='premios'||!o) return;
    if(o.nombre) datos=Object.assign(datos||{},o,{canjes:(o.canjes||[]).length});
    $('apPts2').textContent=fmt(o.total);
    var c=o.canjes||[];
    $('apLista').innerHTML='<h3>Historial de canjes</h3>'+(c.length? c.map(function(x){
      var f=new Date(x.fecha), hora=isNaN(f)?'':f.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
      return '<div class="ap-premio"><i>🎁</i><span><b>'+esc(x.producto)+'</b><small>'+(hora?'Canjeado a las '+hora:'Canjeado')+'</small></span><em>−'+fmt(x.puntos)+' pts</em></div>';
    }).join('') : '<p class="ap-vacio">Todavía no tienes premios.<br>¡Junta puntos y participa en la subasta! 🎄</p>');
  },function(){});
}

/* ---------- Actualización en tiempo real ---------- */
var canjesVistos=null;
function actualizar(){
  llamar({api:'estado',clave:clave()},function(o){
    if(!o||!o.nombre) return;
    var antes=Number((datos||{}).total||0), nuevos=Number(o.canjes||0);
    datos=Object.assign(datos||{},o);
    if(canjesVistos!==null&&nuevos>canjesVistos){
      llamar({api:'premios',clave:clave()},function(p){ var u=(p&&p.canjes&&p.canjes[0])||{}; if(vista==='inicio') inicio({premio:u.producto||'un premio',desde:antes}); else aviso('🎁 ¡Ganaste '+(u.producto||'un premio')+' en la subasta!'); },function(){});
    } else if(vista==='inicio'){ contador($('apPts'),antes,Number(o.total||0)); var m=$('apMini'); if(m) m.innerHTML=mini(o); }
    canjesVistos=nuevos;
    if(vista==='premios') cargarPremios();
  },function(){});
}
function revisarModo(){
  llamar({api:'modo'},function(o){
    if(!o) return;
    if(!activa){ if(o.app) mostrarApp(o); return; }
    if(o.app===false&&forzar!=='1'){ location.reload(); return; }
    var nuevos=['qr','mural','premios'].filter(function(k){return !!o[k]&&!F[k];});
    var cambio=['qr','mural','premios'].some(function(k){return !!o[k]!==F[k];}), finCambio=!!o.terminado!==F.terminado;
    F={qr:!!o.qr,mural:!!o.mural,premios:!!o.premios,terminado:!!o.terminado};
    if(finCambio&&vista==='inicio'){ inicio({}); return; }
    if(cambio) pintarTiles(nuevos);
    if(modoListo&&datos&&datos.nombre) nuevos.forEach(notificar);
    modoListo=true;
  },function(){});
}

/* ---------- Encender / apagar la app ---------- */
function mostrarApp(m){
  if(activa) return; activa=true;
  if(m){ F={qr:!!m.qr,mural:!!m.mural,premios:!!m.premios,terminado:!!m.terminado}; modoListo=true; }
  try{ if(window.apagarSonidoTelon) window.apagarSonidoTelon(); }catch(e){}
  window.__appActiva=true;
  ['teatro','sonido','refrescarTelon'].forEach(function(id){var el=$(id); if(el) el.style.display='none';});
  document.title='Posada Navideña'; $('appPosada').hidden=false; esferas(); dibujarNinos(); ponerLetrero('Posada Gomez 2026');
  verEscena('normal'); poner('<div class="ap-cargando">Cargando…</div>');
  llamar({api:'estado',clave:clave()},function(o){
    if(o&&o.evento){ ponerLetrero(o.evento); }
    if(o&&o.nombre){ datos=o; canjesVistos=Number(o.canjes||0); inicio({}); } else registro();
  },function(){ registro(); });
  setInterval(function(){ if(datos&&datos.nombre&&(vista==='inicio'||vista==='premios')) actualizar(); },10000);
}
$('apRefrescar').onclick=function(){ location.reload(); };
if(forzar==='1'){ mostrarApp(null); revisarModo(); setInterval(revisarModo,15000); }
else if(forzar!=='0'){ revisarModo(); setInterval(revisarModo,15000); }
addEventListener('resize',function(){ if(activa) esferas(); });
})();
